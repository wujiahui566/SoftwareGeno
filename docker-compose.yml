services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${GENO_MONGODB_DATABASE:-geno}
    ports:
      - "${GENO_MONGODB_PORT:-27017}:27017"
    volumes:
      - geno-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  geno-mongodb-data:
